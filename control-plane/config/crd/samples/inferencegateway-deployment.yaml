#
# Standalone manifests that mirror exactly what the InferenceGatewayController
# generates from an InferenceGateway CR. Apply these if you want to run the
# gateway without the controller, or use them for debugging.
#
# Apply:
#   kubectl apply -f inferencegateway-deployment.yaml
#
# Prerequisites:
#   1. Image loaded into the cluster:
#        kind load docker-image localhost/consul-inference-gateway:0.1.0-dev --name <cluster>
#   2. ConfigMap created (see bottom of this file).
# ---------------------------------------------------------------------------

# ── ConfigMap: inference-registry ──────────────────────────────────────────
# The controller mounts this at /app/configs/inference-registry.yaml inside
# the gateway container. Keep cluster names in sync with your Envoy CDS catalog.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-registry
  namespace: default
data:
  inference-registry.yaml: |
    clusters:
      - name: gpt-5.3-codex
        vendor: openai
        labels: [code]
        model: "gpt-5.3-codex"

      - name: claude-4.7-review
        vendor: anthropic
        labels: [code-review, code]
        model: "claude-4.7-sonnet-review"

      - name: gpt-5.3
        vendor: openai
        labels: [document, general]
        model: "gpt-5.3"

