apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: routeupstreamlimitsfilters.consul.hashicorp.com
spec:
  group: consul.hashicorp.com
  names:
    kind: RouteUpstreamLimitsFilter
    listKind: RouteUpstreamLimitsFilterList
    plural: routeupstreamlimitsfilters
    singular: routeupstreamlimitsfilter
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The sync status of the resource with Consul
      jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - description: The last successful synced time of the resource with Consul
      jsonPath: .status.lastSyncedTime
      name: Last Synced
      type: date
    - description: The age of the resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RouteUpstreamLimitsFilter is the Schema for the routeupstreamlimitsfilters API.
          It is referenced from an HTTPRoute backendRef via an extensionRef filter to
          apply per-service upstream circuit-breaker limits and passive health checking
          (Envoy outlier detection) to the routed service behind an API Gateway.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RouteUpstreamLimitsFilterSpec defines the desired state of
              RouteUpstreamLimitsFilter.
            properties:
              maxConcurrentRequests:
                description: |-
                  MaxConcurrentRequests is the maximum number of in-flight requests allowed to
                  the upstream cluster at a point in time.
                minimum: 0
                type: integer
              maxConnections:
                description: |-
                  MaxConnections is the maximum number of connections the gateway proxy can
                  make to the upstream service.
                minimum: 0
                type: integer
              maxPendingRequests:
                description: |-
                  MaxPendingRequests is the maximum number of requests that are queued while
                  waiting for an available connection.
                minimum: 0
                type: integer
              passiveHealthCheck:
                description: |-
                  PassiveHealthCheck configures how the gateway monitors the upstream for
                  removal from the load-balancing pool (Envoy outlier detection).
                properties:
                  baseEjectionTime:
                    description: |-
                      The base time that a host is ejected for. The real time is equal to the base time
                      multiplied by the number of times the host has been ejected and is capped by
                      max_ejection_time (Default 300s). Defaults to 30s.
                    type: string
                  enforcingConsecutive5xx:
                    description: |-
                      EnforcingConsecutive5xx is the % chance that a host will be actually ejected
                      when an outlier status is detected through consecutive 5xx.
                      This setting can be used to disable ejection or to ramp it up slowly.
                      Ex. Setting this to 10 will make it a 10% chance that the host will be ejected.
                    format: int32
                    type: integer
                  interval:
                    description: |-
                      Interval between health check analysis sweeps. Each sweep may remove
                      hosts or return hosts to the pool. Ex. setting this to "10s" will set
                      the interval to 10 seconds.
                    type: string
                  maxEjectionPercent:
                    description: |-
                      The maximum % of an upstream cluster that can be ejected due to outlier detection.
                      Defaults to 10% but will eject at least one host regardless of the value.
                    format: int32
                    type: integer
                  maxFailures:
                    description: |-
                      MaxFailures is the count of consecutive failures that results in a host
                      being removed from the pool.
                    format: int32
                    type: integer
                type: object
            type: object
          status:
            properties:
              conditions:
                description: Conditions indicate the latest available observations
                  of a resource's current state.
                items:
                  description: |-
                    Conditions define a readiness condition for a Consul resource.
                    See: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#typical-status-properties
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              lastSyncedTime:
                description: LastSyncedTime is the last time the resource successfully
                  synced with Consul.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

