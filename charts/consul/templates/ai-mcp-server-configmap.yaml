{{- if and .Values.ai .Values.ai.enabled .Values.connectInject.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "consul.fullname" . }}-ai-mcp-server-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "consul.name" . }}
    chart: {{ template "consul.chart" . }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
    component: ai-mcp-server
data:
  config.json: |
    {
      "interceptorPort": {{ .Values.ai.mcpServer.defaults.interceptorPort }},
      "transport": {{ .Values.ai.mcpServer.defaults.transport | quote }},
      "path": {{ .Values.ai.mcpServer.defaults.path | quote }},
      "protocolVersion": {{ .Values.ai.mcpServer.defaults.protocolVersion | quote }},
      "resources": {{ .Values.ai.mcpServer.defaults.resources | toJson }}
    }
{{- end }}
