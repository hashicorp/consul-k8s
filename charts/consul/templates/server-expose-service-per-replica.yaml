{{- $serverEnabled := (or (and (ne (.Values.server.enabled | toString) "-") .Values.server.enabled) (and (eq (.Values.server.enabled | toString) "-") .Values.global.enabled)) -}}
{{- if (and $serverEnabled .Values.server.exposeServicePerReplica.enabled) }}
{{- $root := . }}
{{- range $i := until (.Values.server.replicas | int) }}
---
# Service with an external IP to reach this specific Consul server replica.
# Used so each server can advertise its own externally-reachable address.
apiVersion: v1
kind: Service
metadata:
  name: {{ template "consul.fullname" $root }}-server-{{ $i }}-lb
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ template "consul.name" $root }}
    chart: {{ template "consul.chart" $root }}
    heritage: {{ $root.Release.Service }}
    release: {{ $root.Release.Name }}
    component: server
  {{- if $root.Values.server.exposeServicePerReplica.annotations }}
  annotations:
    {{ tpl $root.Values.server.exposeServicePerReplica.annotations (merge (dict "index" $i) $root) | nindent 4 | trim }}
  {{- end }}
spec:
  type: LoadBalancer
  ports:
    {{- range $root.Values.server.exposeServicePerReplica.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ default .port .targetPort }}
      {{- if .protocol }}
      protocol: {{ .protocol }}
      {{- end }}
    {{- end }}
  selector:
    statefulset.kubernetes.io/pod-name: {{ template "consul.fullname" $root }}-server-{{ $i }}
{{- end }}
{{- end }}
