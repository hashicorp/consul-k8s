{{- if or (and (ne (.Values.connectInject.enabled | toString) "-") .Values.connectInject.enabled) (and (eq (.Values.connectInject.enabled | toString) "-") .Values.global.enabled) }}
# ClusterRole for the connect-injector controller.
# Rule authoring conventions:
#   • One rule block per API group / resource family.
#   • Verbs are listed in alphabetical order.
#   • Duplicate rules are intentionally absent — RBAC unions all matching
#     rules so duplicates only create upgrade confusion.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "consul.fullname" . }}-connect-injector
  labels:
    app: {{ template "consul.name" . }}
    chart: {{ template "consul.chart" . }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
    component: connect-injector
rules:

# ── Consul CRDs (config-entry controllers) ───────────────────────────────────
- apiGroups:
  - consul.hashicorp.com
  resources:
  - servicedefaults
  - serviceresolvers
  - proxydefaults
  - meshes
  - exportedservices
  - servicerouters
  - servicesplitters
  - serviceintentions
  - ingressgateways
  - terminatinggateways
  - gatewayclassconfigs
  - meshservices
  - samenessgroups
  - controlplanerequestlimits
  - ratelimits
  - routeretryfilters
  - routetimeoutfilters
  - routeauthfilters
  - routetlssdsfilters
  - routeextprocs
  - gatewaypolicies
  - customgatewaypolicies
  - registrations
  {{- if .Values.global.peering.enabled }}
  - peeringacceptors
  - peeringdialers
  {{- end }}
  - jwtproviders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# Consul CRD status sub-resources
- apiGroups:
  - consul.hashicorp.com
  resources:
  - servicedefaults/status
  - serviceresolvers/status
  - proxydefaults/status
  - meshes/status
  - exportedservices/status
  - servicerouters/status
  - servicesplitters/status
  - serviceintentions/status
  - ingressgateways/status
  - terminatinggateways/status
  - samenessgroups/status
  - controlplanerequestlimits/status
  - ratelimits/status
  - registrations/status
  {{- if .Values.global.peering.enabled }}
  - peeringacceptors/status
  - peeringdialers/status
  {{- end }}
  - jwtproviders/status
  - routeauthfilters/status
  - routetlssdsfilters/status
  - routeextprocs/status
  - gatewaypolicies/status
  - customgatewaypolicies/status
  verbs:
  - get
  - patch
  - update

# ── AI CRDs ───────────────────────────────────────────────────────────────────
# Always present so the controller can manage finalizers and status even after
# ai.enabled is flipped to false mid-cluster-lifecycle.
- apiGroups:
  - consul.hashicorp.com
  resources:
  - inferencemodelconfigs
  - mcpserverconfigs
  - agentconfigs
  - inferencepoolconfigs
  - inferencegateways
  verbs:
  - get
  - list
  - update
  - watch

# AI CRD status sub-resources — syncStatus() calls r.Client.Status().Patch()
- apiGroups:
  - consul.hashicorp.com
  resources:
  - inferencemodelconfigs/status
  - mcpserverconfigs/status
  - agentconfigs/status
  - inferencepoolconfigs/status
  - inferencegateways/status
  verbs:
  - get
  - patch
  - update

# AI CRD finalizer sub-resources — controllerutil.AddFinalizer/RemoveFinalizer
- apiGroups:
  - consul.hashicorp.com
  resources:
  - inferencemodelconfigs/finalizers
  - mcpserverconfigs/finalizers
  - agentconfigs/finalizers
  - inferencepoolconfigs/finalizers
  - inferencegateways/finalizers
  verbs:
  - update

# ── Gateway API (gateway.networking.k8s.io) ───────────────────────────────────
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  - gateways
  - httproutes
  - tcproutes
  - referencegrants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses/finalizers
  - gateways/finalizers
  - httproutes/finalizers
  - tcproutes/finalizers
  verbs:
  - update

- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses/status
  - gateways/status
  - httproutes/status
  - tcproutes/status
  verbs:
  - get
  - patch
  - update

# ── Custom Gateway API (consul.hashicorp.com) ─────────────────────────────────
- apiGroups:
  - consul.hashicorp.com
  resources:
  - customgatewayclasses
  - cgateways
  - chttproutes
  - ctcproutes
  - creferencegrants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

- apiGroups:
  - consul.hashicorp.com
  resources:
  - customgatewayclasses/finalizers
  - cgateways/finalizers
  - chttproutes/finalizers
  - ctcproutes/finalizers
  verbs:
  - update

- apiGroups:
  - consul.hashicorp.com
  resources:
  - customgatewayclasses/status
  - cgateways/status
  - chttproutes/status
  - ctcproutes/status
  verbs:
  - get
  - patch
  - update

# ── Kubernetes apps ───────────────────────────────────────────────────────────
# Deployments — InferenceGatewayController + api-gateway controller own these.
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# HorizontalPodAutoscalers — api-gateway scaling feature.
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# ── Kubernetes core ───────────────────────────────────────────────────────────
# Events — controller-runtime event recorder.
- apiGroups: [""]
  resources:
  - events
  verbs:
  - create
  - patch

# Services — InferenceGatewayController creates, patches, and deletes Services.
# patch is required: reconcileService() calls r.Client.Patch().
- apiGroups: [""]
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# Secrets and ServiceAccounts
- apiGroups: [""]
  resources:
  - secrets
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch

# Read-only core resources
- apiGroups: [""]
  resources:
  - endpoints
  - namespaces
  - nodes
  - configmaps
  verbs:
  - get
  - list
  - watch

# EndpointSlices — watched by the endpoints controller (migrated from core Endpoints).
- apiGroups: ["discovery.k8s.io"]
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch

# Pods — sidecar-injection read/update.
- apiGroups: [""]
  resources:
  - pods
  verbs:
  - get
  - list
  - update
  - watch

# ── RBAC ──────────────────────────────────────────────────────────────────────
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch

# ── Leader election ───────────────────────────────────────────────────────────
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - update

# ── Policy ────────────────────────────────────────────────────────────────────
- apiGroups:
  - policy
  resources:
  - podsecuritypolicies
  verbs:
  - use

# ── Optional: Vault webhook CA rotation ──────────────────────────────────────
{{- if (and .Values.global.secretsBackend.vault.enabled .Values.global.secretsBackend.vault.connectInjectRole .Values.global.secretsBackend.vault.connectInject.tlsCert.secretName .Values.global.secretsBackend.vault.connectInject.caCert.secretName) }}
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs:
  - get
  - list
  - patch
  - watch
{{- end }}

# ── Optional: peering secrets ─────────────────────────────────────────────────
{{- if .Values.global.peering.enabled }}
- apiGroups: [""]
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
{{- end }}

# ── Optional: OpenShift SCC ───────────────────────────────────────────────────
{{- if .Values.global.openshift.enabled }}
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  resourceNames:
  - {{ .Values.connectInject.apiGateway.managedGatewayClass.openshiftSCCName | default "restricted-v2" }}
  verbs:
  - use
{{- end }}

{{- end }}
