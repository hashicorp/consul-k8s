{{- $serverEnabled := (or (and (ne (.Values.server.enabled | toString) "-") .Values.server.enabled) (and (eq (.Values.server.enabled | toString) "-") .Values.global.enabled)) -}}
{{- if (or (and $serverEnabled (eq (int .Values.server.updatePartition) 0)) .Values.externalServers.enabled) }}
{{- $useReplicationToken := and .Values.global.acls.manageSystemACLs (not .Values.global.acls.bootstrapToken.secretName) .Values.global.acls.replicationToken.secretName -}}
{{- if or (and .Values.global.acls.bootstrapToken.secretName (not .Values.global.acls.bootstrapToken.secretKey)) (and .Values.global.acls.bootstrapToken.secretKey (not .Values.global.acls.bootstrapToken.secretName)) }}{{ fail "both global.acls.bootstrapToken.secretKey and global.acls.bootstrapToken.secretName must be set if one of them is provided" }}{{ end -}}
{{- if and .Values.global.acls.manageSystemACLs (or (and .Values.global.acls.replicationToken.secretName (not .Values.global.acls.replicationToken.secretKey)) (and .Values.global.acls.replicationToken.secretKey (not .Values.global.acls.replicationToken.secretName))) }}{{ fail "both global.acls.replicationToken.secretKey and global.acls.replicationToken.secretName must be set if one of them is provided" }}{{ end -}}
{{- if and .Values.global.secretsBackend.vault.enabled .Values.global.acls.manageSystemACLs (not (or .Values.global.acls.bootstrapToken.secretName $useReplicationToken)) }}{{ fail "global.acls.bootstrapToken or global.acls.replicationToken must be provided when global.secretsBackend.vault.enabled and global.acls.manageSystemACLs are true" }}{{ end -}}
{{- if and .Values.global.secretsBackend.vault.enabled (or .Values.global.acls.manageSystemACLs .Values.global.acls.bootstrapToken.secretName) (not .Values.global.secretsBackend.vault.featureGateSetRole) }}{{ fail "global.secretsBackend.vault.featureGateSetRole is required when the feature-gate-set job reads a Vault ACL token." }}{{ end -}}
{{- if and .Values.global.secretsBackend.vault.enabled .Values.global.tls.enabled (not (or .Values.global.acls.manageSystemACLs .Values.global.acls.bootstrapToken.secretName)) (not .Values.global.secretsBackend.vault.consulCARole) }}{{ fail "global.secretsBackend.vault.consulCARole is required when the feature-gate-set job reads only a Vault CA certificate." }}{{ end -}}
{{- if and .Values.externalServers.enabled (not .Values.externalServers.hosts) }}{{ fail "externalServers.hosts must be set if externalServers.enabled is true" }}{{ end -}}
{{- if .Values.externalServers.enabled -}}
{{- $externalServerHost := .Values.externalServers.hosts | first | toString -}}
{{- $validExternalServerHost := or (regexMatch "^[A-Za-z0-9][A-Za-z0-9.-]*$" $externalServerHost) (regexMatch "^[0-9a-fA-F:.]+$" $externalServerHost) (regexMatch "^provider=[^[:space:]=]+([[:space:]][A-Za-z0-9_]+=[^[:space:]]+)*$" $externalServerHost) -}}
{{- if not $validExternalServerHost }}{{ fail "The feature-gate-set job requires externalServers.hosts[0] to be a DNS name, IP address, or provider= auto-join string; exec= addresses are not supported." }}{{ end -}}
{{- end -}}
