apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "consul.fullname" . }}-feature-gate-set
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "consul.name" . }}
    chart: {{ template "consul.chart" . }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
    component: feature-gate-set
    {{- if .Values.global.extraLabels }}
      {{- toYaml .Values.global.extraLabels | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      name: {{ template "consul.fullname" . }}-feature-gate-set
      labels:
        app: {{ template "consul.name" . }}
        chart: {{ template "consul.chart" . }}
        release: {{ .Release.Name }}
        component: feature-gate-set
        {{- if .Values.global.extraLabels }}
          {{- toYaml .Values.global.extraLabels | nindent 8 }}
        {{- end }}
      annotations:
        "consul.hashicorp.com/connect-inject": "false"
        "consul.hashicorp.com/mesh-inject": "false"
        {{- if (and .Values.global.secretsBackend.vault.enabled (or .Values.global.tls.enabled .Values.global.acls.manageSystemACLs .Values.global.acls.bootstrapToken.secretName)) }}
        "vault.hashicorp.com/agent-pre-populate-only": "true"
        "vault.hashicorp.com/agent-inject": "true"
        {{- if (or .Values.global.acls.manageSystemACLs .Values.global.acls.bootstrapToken.secretName) }}
        "vault.hashicorp.com/role": {{ .Values.global.secretsBackend.vault.manageSystemACLsRole }}
        {{- if .Values.global.acls.bootstrapToken.secretName }}
        {{- with .Values.global.acls.bootstrapToken }}
        "vault.hashicorp.com/agent-inject-secret-bootstrap-token": "{{ .secretName }}"
        "vault.hashicorp.com/agent-inject-template-bootstrap-token": {{ template "consul.vaultSecretTemplate" . }}
        {{- end }}
        {{- end }}
        {{- else }}
        "vault.hashicorp.com/role": {{ .Values.global.secretsBackend.vault.consulCARole }}
        {{- end }}
        {{- if .Values.global.tls.enabled }}
        "vault.hashicorp.com/agent-inject-secret-serverca.crt": {{ .Values.global.tls.caCert.secretName }}
        "vault.hashicorp.com/agent-inject-template-serverca.crt": {{ template "consul.serverTLSCATemplate" . }}
        {{- end }}
        {{- if and .Values.global.secretsBackend.vault.ca.secretName .Values.global.secretsBackend.vault.ca.secretKey }}
        "vault.hashicorp.com/agent-extra-secret": "{{ .Values.global.secretsBackend.vault.ca.secretName }}"
        "vault.hashicorp.com/ca-cert": "/vault/custom/{{ .Values.global.secretsBackend.vault.ca.secretKey }}"
        {{- end }}
        {{- if .Values.global.secretsBackend.vault.agentAnnotations }}
        {{ tpl .Values.global.secretsBackend.vault.agentAnnotations . | nindent 8 | trim }}
        {{- end }}
        {{- if (and (.Values.global.secretsBackend.vault.vaultNamespace) (not (hasKey (default "" .Values.global.secretsBackend.vault.agentAnnotations | fromYaml) "vault.hashicorp.com/namespace"))) }}
        "vault.hashicorp.com/namespace": "{{ .Values.global.secretsBackend.vault.vaultNamespace }}"
        {{- end }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ template "consul.fullname" . }}-feature-gate-set
      {{- if (or (and .Values.global.tls.enabled (not (or .Values.externalServers.useSystemRoots .Values.global.secretsBackend.vault.enabled))) (and .Values.global.acls.manageSystemACLs (not .Values.global.secretsBackend.vault.enabled))) }}
      volumes:
      {{- if and .Values.global.tls.enabled (not (or .Values.externalServers.useSystemRoots .Values.global.secretsBackend.vault.enabled)) }}
        - name: consul-ca-cert
          secret:
            {{- if .Values.global.tls.caCert.secretName }}
            secretName: {{ .Values.global.tls.caCert.secretName }}
            {{- else }}
            secretName: {{ template "consul.fullname" . }}-ca-cert
            {{- end }}
            items:
              - key: {{ default "tls.crt" .Values.global.tls.caCert.secretKey }}
                path: tls.crt
      {{- end }}
      {{- if (and .Values.global.acls.manageSystemACLs (not .Values.global.secretsBackend.vault.enabled)) }}
        - name: bootstrap-acl-token
          secret:
            secretName: {{ default (printf "%s-bootstrap-acl-token" (include "consul.fullname" .)) .Values.global.acls.bootstrapToken.secretName }}
            items:
              - key: {{ default "token" .Values.global.acls.bootstrapToken.secretKey }}
                path: token
      {{- end }}
      {{- end }}
      containers:
      - name: feature-gate-set
        image: "{{ default .Values.global.image .Values.server.image | trimPrefix "\"" | trimSuffix "\"" }}"
        {{ template "consul.imagePullPolicy" . }}
        {{- include "consul.restrictedSecurityContext" . | nindent 8 }}
        env:
        {{- include "consul.consulK8sConsulServerEnvVars" . | nindent 8 }}
        {{- if (or .Values.global.acls.manageSystemACLs (and .Values.global.acls.bootstrapToken.secretName .Values.global.acls.bootstrapToken.secretKey)) }}
        {{- if .Values.global.secretsBackend.vault.enabled }}
        - name: CONSUL_HTTP_TOKEN_FILE
          value: /vault/secrets/bootstrap-token
        {{- else if (and .Values.global.acls.bootstrapToken.secretName .Values.global.acls.bootstrapToken.secretKey) }}
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.acls.bootstrapToken.secretName }}
              key: {{ .Values.global.acls.bootstrapToken.secretKey }}
        {{- else }}
        - name: CONSUL_HTTP_TOKEN_FILE
          value: /consul/acl/tokens/token
        {{- end }}
        {{- end }}
        {{- if (or (and .Values.global.tls.enabled (not (or .Values.externalServers.useSystemRoots .Values.global.secretsBackend.vault.enabled))) (and .Values.global.acls.manageSystemACLs (not .Values.global.secretsBackend.vault.enabled))) }}
        volumeMounts:
        {{- if and .Values.global.tls.enabled (not (or .Values.externalServers.useSystemRoots .Values.global.secretsBackend.vault.enabled)) }}
          - name: consul-ca-cert
            mountPath: /consul/tls/ca
            readOnly: true
        {{- end }}
        {{- if (and .Values.global.acls.manageSystemACLs (not .Values.global.secretsBackend.vault.enabled)) }}
          - name: bootstrap-acl-token
            mountPath: /consul/acl/tokens
            readOnly: true
        {{- end }}
        {{- end }}
        command:
        - "/bin/sh"
        - "-ec"
        - |
          {{- if .Values.global.tls.enabled }}
          export CONSUL_HTTP_ADDR="https://${CONSUL_ADDRESSES}:${CONSUL_HTTP_PORT}"
          {{- if and (not .Values.global.secretsBackend.vault.enabled) (not (and .Values.externalServers.enabled .Values.externalServers.useSystemRoots)) }}
          export CONSUL_CACERT=/consul/tls/ca/tls.crt
          {{- end }}
          {{- else }}
          export CONSUL_HTTP_ADDR="http://${CONSUL_ADDRESSES}:${CONSUL_HTTP_PORT}"
          {{- end }}

          # Each line: <gate-name> <enabled|disabled>
          # To add a future gate, append a new line here.
          GATES="
          {{- if default false (and .Values.ai .Values.ai.enabled) }}
          consul-ai enabled
          {{- else }}
          consul-ai disabled
          {{- end }}
          "

          echo "$GATES" | while read -r name value; do
            [ -z "$name" ] && continue
            echo "Setting feature gate: $name=$value"
            consul operator feature set "$name" "$value"
          done
        {{- if .Values.global.acls.resources }}
        resources:
          {{- toYaml .Values.global.acls.resources | nindent 10 }}
        {{- else }}
        resources:
          requests:
            memory: "50Mi"
            cpu: "50m"
          limits:
            memory: "50Mi"
            cpu: "50m"
        {{- end }}
      {{- if .Values.global.acls.tolerations }}
      tolerations:
        {{ tpl .Values.global.acls.tolerations . | indent 8 | trim }}
      {{- end }}
      {{- if .Values.global.acls.nodeSelector }}
      nodeSelector:
        {{ tpl .Values.global.acls.nodeSelector . | indent 8 | trim }}
      {{- end }}
{{- end }}
