#
# This post-install/post-upgrade Job calls "consul operator feature set" for
# every feature gate that Helm manages. Consul's feature-gate Raft policy is
# NOT updated by config-file reloads after the initial bootstrap, so this job
# is the authoritative path to keep gate state in sync with values.yaml on
# every install and upgrade.
#
# To add a new gate in the future, append another line to the GATES heredoc
# in the shell script below:
#   <gate-name> enabled|disabled
#
# No other files need to change.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "consul.fullname" . }}-feature-gate-set
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "consul.name" . }}
    chart: {{ template "consul.chart" . }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
    component: feature-gate-set
    {{- if .Values.global.extraLabels }}
      {{- toYaml .Values.global.extraLabels | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      name: {{ template "consul.fullname" . }}-feature-gate-set
      labels:
        app: {{ template "consul.name" . }}
        chart: {{ template "consul.chart" . }}
        release: {{ .Release.Name }}
        component: feature-gate-set
        {{- if .Values.global.extraLabels }}
          {{- toYaml .Values.global.extraLabels | nindent 8 }}
        {{- end }}
      annotations:
        "consul.hashicorp.com/connect-inject": "false"
        "consul.hashicorp.com/mesh-inject": "false"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ template "consul.fullname" . }}-feature-gate-set
      {{- if (or .Values.global.tls.enabled .Values.global.acls.manageSystemACLs) }}
      volumes:
      {{- if and .Values.global.tls.enabled (not .Values.global.secretsBackend.vault.enabled) }}
      {{- if not (and .Values.externalServers.enabled .Values.externalServers.useSystemRoots) }}
      - name: consul-ca-cert
        secret:
          {{- if .Values.global.tls.caCert.secretName }}
          secretName: {{ .Values.global.tls.caCert.secretName }}
          {{- else }}
          secretName: {{ template "consul.fullname" . }}-ca-cert
          {{- end }}
          items:
          - key: {{ default "tls.crt" .Values.global.tls.caCert.secretKey }}
            path: tls.crt
      {{- end }}
      {{- end }}
      {{- if .Values.global.acls.manageSystemACLs }}
      - name: bootstrap-acl-token
        secret:
          secretName: {{ template "consul.fullname" . }}-bootstrap-acl-token
          items:
          - key: token
            path: token
      {{- end }}
      {{- end }}
      containers:
      - name: feature-gate-set
        image: "{{ default .Values.global.image .Values.server.image | trimPrefix "\"" | trimSuffix "\"" }}"
        {{ template "consul.imagePullPolicy" . }}
        {{- include "consul.restrictedSecurityContext" . | nindent 8 }}
        env:
        {{- include "consul.consulK8sConsulServerEnvVars" . | nindent 8 }}
        {{- if .Values.global.acls.manageSystemACLs }}
        - name: CONSUL_HTTP_TOKEN_FILE
          value: /consul/acl/tokens/token
        {{- end }}
        {{- if (or .Values.global.tls.enabled .Values.global.acls.manageSystemACLs) }}
        volumeMounts:
        {{- if and .Values.global.tls.enabled (not .Values.global.secretsBackend.vault.enabled) }}
        {{- if not (and .Values.externalServers.enabled .Values.externalServers.useSystemRoots) }}
        - name: consul-ca-cert
          mountPath: /consul/tls/ca
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if .Values.global.acls.manageSystemACLs }}
        - name: bootstrap-acl-token
          mountPath: /consul/acl/tokens
          readOnly: true
        {{- end }}
        {{- end }}
        command:
        - "/bin/sh"
        - "-ec"
        - |
          {{- if .Values.global.tls.enabled }}
          export CONSUL_HTTP_ADDR="https://${CONSUL_ADDRESSES}:${CONSUL_HTTP_PORT}"
          {{- if and (not .Values.global.secretsBackend.vault.enabled) (not (and .Values.externalServers.enabled .Values.externalServers.useSystemRoots)) }}
          export CONSUL_CACERT=/consul/tls/ca/tls.crt
          {{- end }}
          {{- else }}
          export CONSUL_HTTP_ADDR="http://${CONSUL_ADDRESSES}:${CONSUL_HTTP_PORT}"
          {{- end }}

          # Each line: <gate-name> <enabled|disabled>
          # To add a future gate, append a new line here.
          GATES="
          {{- if default false .Values.ai.enabled }}
          consul-ai enabled
          {{- else }}
          consul-ai disabled
          {{- end }}
          "

          echo "$GATES" | while read -r name value; do
            [ -z "$name" ] && continue
            echo "Setting feature gate: $name=$value"
            consul operator feature set "$name" "$value"
          done
        resources:
          requests:
            memory: "50Mi"
            cpu: "50m"
          limits:
            memory: "50Mi"
            cpu: "50m"
      {{- if .Values.global.acls.tolerations }}
      tolerations:
        {{ tpl .Values.global.acls.tolerations . | indent 8 | trim }}
      {{- end }}
{{- end }}
