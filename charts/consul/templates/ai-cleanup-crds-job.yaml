#
# This hook Job runs the "ai-cleanup" subcommand to strip finalizers from AI CRs
# so that Kubernetes allows their deletion before CRDs are removed.
#
# Hook trigger logic:
#   • helm uninstall (pre-delete)  — always runs, regardless of ai.enabled.
#   • helm upgrade   (pre-upgrade) — only runs when ai.enabled is false/absent,
#                                    i.e. when the operator is being disabled and
#                                    the CRDs are about to be removed.
#     When ai.enabled=true an upgrade keeps the operator running, so we must NOT
#     strip finalizers — the controller itself manages CR lifecycle.
#
# The subcommand:
#   1. Lists all InferenceModelConfig / McpServerConfig / AgentConfig /
#      InferencePoolConfig CRs — skips each resource type if its CRD is absent.
#   2. Strips finalizers from each CR and deletes it.
#   3. Waits for the CR to be fully gone.
#
# The command is idempotent — running it when no CRs exist is a no-op (exit 0).
#
# Execution order (Helm hook-weight):
#   -10 = SA + ClusterRole + ClusterRoleBinding created first
#    -5 = this Job runs (strips finalizers + deletes CRs)
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "consul.fullname" . }}-ai-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "consul.name" . }}
    chart: {{ template "consul.chart" . }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
    component: ai-cleanup
    {{- if .Values.global.extraLabels }}
      {{- toYaml .Values.global.extraLabels | nindent 4 }}
    {{- end }}
  annotations:
    {{- if and .Values.ai .Values.ai.enabled }}
    "helm.sh/hook": pre-delete
    {{- else }}
    "helm.sh/hook": pre-delete,pre-upgrade
    {{- end }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      name: {{ template "consul.fullname" . }}-ai-cleanup
      labels:
        app: {{ template "consul.name" . }}
        chart: {{ template "consul.chart" . }}
        release: {{ .Release.Name }}
        component: ai-cleanup
        {{- if .Values.global.extraLabels }}
          {{- toYaml .Values.global.extraLabels | nindent 8 }}
        {{- end }}
      annotations:
        "consul.hashicorp.com/connect-inject": "false"
        "consul.hashicorp.com/mesh-inject": "false"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ template "consul.fullname" . }}-ai-cleanup
      containers:
        - name: ai-cleanup
          image: {{ .Values.global.imageK8S }}
          {{ template "consul.imagePullPolicy" . }}
          {{- include "consul.restrictedSecurityContext" . | nindent 10 }}
          command:
            - consul-k8s-control-plane
          args:
            - ai-cleanup
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "50Mi"
              cpu: "50m"
      {{- if .Values.global.acls.tolerations }}
      tolerations:
        {{ tpl .Values.global.acls.tolerations . | indent 8 | trim }}
      {{- end }}
