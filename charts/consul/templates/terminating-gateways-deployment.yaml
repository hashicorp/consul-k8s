{{- if .Values.terminatingGateways.enabled }}
{{- if not .Values.connectInject.enabled }}{{ fail "connectInject.enabled must be true" }}{{ end -}}
{{- if and .Values.global.adminPartitions.enabled (not .Values.global.enableConsulNamespaces) }}{{ fail "global.enableConsulNamespaces must be true if global.adminPartitions.enabled=true" }}{{ end }}
{{ template "consul.validateRequiredCloudSecretsExist" . }}
{{ template "consul.validateCloudSecretKeys" . }}

{{- $root := . }}
{{- $defaults := .Values.terminatingGateways.defaults }}
{{- $names := dict }}

{{- $gateways := .Values.terminatingGateways.gateways }}
{{- range $outerTerminatingIndex, $outerTerminatingVal := $gateways }}

{{- range $innerTerminatingIndex, $innerTerminatingVal := $gateways }}
{{- if (and (ne $outerTerminatingIndex $innerTerminatingIndex) (eq $outerTerminatingVal.name $innerTerminatingVal.name)) }}
{{ fail (cat "terminating gateways must have unique names but found duplicate name" $innerTerminatingVal.name) }}
{{ end -}}
{{ end -}}

{{- range $outerIngressIndex, $outerIngressVal := $root.Values.ingressGateways.gateways }}
{{- if (eq $outerTerminatingVal.name $outerIngressVal.name) }}
{{ fail (cat "terminating gateways cannot have duplicate names of any ingress gateways but found duplicate name" $outerTerminatingVal.name) }}
{{ end -}}
{{ end -}}
{{ end -}}

{{- range .Values.terminatingGateways.gateways }}

{{- if empty .name }}
# Check that name is not empty
{{ fail "Terminating gateway names cannot be empty"}}
{{ end -}}
{{- if hasKey $names .name }}
# Check that the name doesn't already exist
{{ fail "Terminating gateway names must be unique"}}
{{ end -}}
{{- /* Add the gateway name to the $names dict to ensure uniqueness */ -}}
{{- $_ := set $names .name .name }}
{{- /* Effective credential-injection config: per-gateway fields override the
       default field-by-field (a deep merge, not a whole-object replace, so a
       partial per-gateway block keeps the default images/ConfigMap names). */ -}}
{{- $ci := mergeOverwrite (deepCopy (default (dict) $defaults.credentialInjection)) (default (dict) .credentialInjection) }}
{{- /* Nil-aware drain default: preserve an explicit drainSeconds: 0 (the sprig
       "default" helper treats numeric zero as empty, which the controller does
       not). Only meaningful when credential injection is enabled. */ -}}
{{- $drainSeconds := 30 }}
{{- if not (kindIs "invalid" $ci.drainSeconds) }}
{{- $drainSeconds = int $ci.drainSeconds }}
{{- end }}
{{- /* Fail fast on an incomplete/invalid enabled config (Helm renders without
       CRD/controller validation), mirroring the controller-side checks. */ -}}
{{- if and $ci $ci.enabled }}
{{- include "consul.validateTerminatingGatewayCredentialInjection" (dict "ci" $ci "name" .name) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "consul.fullname" $root }}-{{ .name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ template "consul.name" $root }}
    chart: {{ template "consul.chart" $root }}
    heritage: {{ $root.Release.Service }}
    release: {{ $root.Release.Name }}
    component: terminating-gateway
    terminating-gateway-name: {{ template "consul.fullname" $root }}-{{ .name }}
    {{- if $root.Values.global.extraLabels }}
      {{- toYaml $root.Values.global.extraLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ default $defaults.replicas .replicas }}
  selector:
    matchLabels:
      app: {{ template "consul.name" $root }}
      chart: {{ template "consul.chart" $root }}
      heritage: {{ $root.Release.Service }}
      release: {{ $root.Release.Name }}
      component: terminating-gateway
      terminating-gateway-name: {{ template "consul.fullname" $root }}-{{ .name }}
  template:
    metadata:
      labels:
        app: {{ template "consul.name" $root }}
        chart: {{ template "consul.chart" $root }}
        heritage: {{ $root.Release.Service }}
        release: {{ $root.Release.Name }}
        component: terminating-gateway
        terminating-gateway-name: {{ template "consul.fullname" $root }}-{{ .name }}
        consul.hashicorp.com/connect-inject-managed-by: consul-k8s-endpoints-controller
        {{- if $root.Values.global.extraLabels }}
          {{- toYaml $root.Values.global.extraLabels | nindent 8 }}
        {{- end }}
      annotations:
        "consul.hashicorp.com/connect-inject": "false"
        "consul.hashicorp.com/mesh-inject": "false"
        "consul.hashicorp.com/gateway-kind": "terminating-gateway"
        "consul.hashicorp.com/gateway-consul-service-name": "{{ .name }}"
        {{- if and $ci $ci.enabled }}
        # Rolls the workload when a referenced non-secret credential ConfigMap's
        # content changes. NOTE: `lookup` only runs during `helm install/upgrade`,
        # so for Helm-managed gateways this hash is refreshed on the next Helm
        # operation; editing an externally-managed ConfigMap does not by itself
        # patch a running Deployment (the controller-managed CRD path watches
        # ConfigMaps for that). Optional ConfigMaps are skipped rather than looked
        # up with an empty name (an empty name makes `lookup` return the whole
        # namespace, pulling unrelated ConfigMaps into the hash). Rendered
        # credential files (memory emptyDir) rotate without a pod restart and are
        # intentionally excluded.
        {{- $cmContents := list }}
        {{- range $cmName := list $ci.processorConfigMap $ci.vaultAgentConfigMap $ci.vaultCAConfigMap }}
        {{- if $cmName }}
        {{- $cmContents = append $cmContents (toString (lookup "v1" "ConfigMap" $root.Release.Namespace $cmName)) }}
        {{- end }}
        {{- end }}
        "consul.hashicorp.com/credential-config-checksum": {{ $cmContents | join "\n" | sha256sum | quote }}
        {{- end }}
        {{- if $root.Values.global.enableConsulNamespaces }}
        "consul.hashicorp.com/gateway-namespace": {{ include "consul.terminatingGatewayNamespace" (dict "root" $root "gatewayNamespace" .consulNamespace "defaultsNamespace" $defaults.consulNamespace) }}
        {{- end }}
        {{- if (and $root.Values.global.secretsBackend.vault.enabled $root.Values.global.tls.enabled) }}
        "vault.hashicorp.com/agent-init-first": "true"
        "vault.hashicorp.com/agent-inject": "true"
        "vault.hashicorp.com/role": {{ $root.Values.global.secretsBackend.vault.consulCARole }}
        "vault.hashicorp.com/agent-inject-secret-serverca.crt": {{ $root.Values.global.tls.caCert.secretName }}
        "vault.hashicorp.com/agent-inject-template-serverca.crt": {{ template "consul.serverTLSCATemplate" $root }}
        {{- if and $root.Values.global.secretsBackend.vault.ca.secretName $root.Values.global.secretsBackend.vault.ca.secretKey }}
        "vault.hashicorp.com/agent-extra-secret": {{ $root.Values.global.secretsBackend.vault.ca.secretName }}
        "vault.hashicorp.com/ca-cert": /vault/custom/{{ $root.Values.global.secretsBackend.vault.ca.secretKey }}
        {{- end }}
        {{- if $root.Values.global.secretsBackend.vault.agentAnnotations }}
        {{ tpl $root.Values.global.secretsBackend.vault.agentAnnotations $root | nindent 8 | trim }}
        {{- end }}
        {{- if (and ($root.Values.global.secretsBackend.vault.vaultNamespace) (not (hasKey (default "" $root.Values.global.secretsBackend.vault.agentAnnotations | fromYaml) "vault.hashicorp.com/namespace")))}}
        "vault.hashicorp.com/namespace": "{{ $root.Values.global.secretsBackend.vault.vaultNamespace }}"
        {{- end }}
        {{- if and $ci $ci.enabled }}
        # Credential injection disables the default ServiceAccount-token automount,
        # so point the Vault Agent Injector at the dedicated projected token (else
        # vault-k8s fails with "failed to find service account volume mount").
        "vault.hashicorp.com/agent-service-account-token-volume-name": "consul-auth-method-sa-token"
        {{- end }}
        {{- end }}
        {{- if (and $root.Values.global.metrics.enabled $root.Values.global.metrics.enableGatewayMetrics) }}
        "prometheus.io/scrape": "true"
        {{- if not (hasKey (default "" $defaults.annotations | fromYaml) "prometheus.io/path")}}
        "prometheus.io/path": "/metrics"
        {{- end }}
        "prometheus.io/port": "20200"
        {{- end }}
        {{- if $defaults.annotations }}
        # We allow both default annotations and gateway-specific annotations
        {{- tpl $defaults.annotations $root | nindent 8 }}
        {{- end }}
        {{- if .annotations }}
        {{- tpl .annotations $root | nindent 8 }}
        {{- end }}
    spec:
      {{- if (or $defaults.affinity .affinity) }}
      affinity:
        {{ tpl (default $defaults.affinity .affinity) $root | nindent 8 | trim }}
      {{- end }}
      {{- if (or $defaults.tolerations .tolerations) }}
      tolerations:
        {{ tpl (default $defaults.tolerations .tolerations) $root | nindent 8 | trim }}
      {{- end }}
      {{- if (or $defaults.topologySpreadConstraints .topologySpreadConstraints) }}
      topologySpreadConstraints:
        {{ tpl (default $defaults.topologySpreadConstraints .topologySpreadConstraints) $root | nindent 8 | trim }}
      {{- end }}
      {{- if and $ci $ci.enabled (not $root.Values.global.openshift.enabled) }}
      # Shared fsGroup so the kubelet group-owns the ext_proc socket and rendered
      # credential volumes (with the setgid bit); no privileged root init
      # container is required. Every container joins this group, so Envoy (a
      # group member) can reach the processor's socket.
      #
      # On OpenShift the fsGroup is intentionally omitted: the restricted-v2 SCC
      # uses a MustRunAs range allocated per namespace, so a fixed group would be
      # rejected. The SCC injects an allowed shared group instead.
      securityContext:
        fsGroup: 10001
      {{- end }}
      {{- if and $ci $ci.enabled }}
      # Grace period must exceed the processor's preStop drain plus a shutdown
      # allowance so in-flight requests drain before the pod is killed.
      terminationGracePeriodSeconds: {{ add $drainSeconds 15 }}
      {{- else }}
      terminationGracePeriodSeconds: 10
      {{- end }}
      serviceAccountName: {{ template "consul.fullname" $root }}-{{ .name }}
      {{- if and $ci $ci.enabled }}
      # Credential injection isolates the Vault-audience token (camp-vault-token)
      # from Envoy and the credential processor. Disable the default
      # ServiceAccount-token automount so no container silently receives a
      # default-audience JWT for the same ServiceAccount used for Vault auth; the
      # token is projected explicitly only into the containers that perform
      # Consul login (below).
      automountServiceAccountToken: false
      {{- end }}
      volumes:
      - name: tmp
        emptyDir:
          medium: "Memory"
      - name: consul-service
        emptyDir:
          medium: "Memory"
      {{- if and $ci $ci.enabled (or $root.Values.global.acls.manageSystemACLs (and $root.Values.global.secretsBackend.vault.enabled $root.Values.global.tls.enabled)) }}
      # Dedicated default-audience ServiceAccount token. It is mounted into the
      # init and Envoy containers for Consul login (ACLs), and/or discovered by
      # the global Vault Agent Injector via the
      # vault.hashicorp.com/agent-service-account-token-volume-name annotation.
      # It exists because the default automount is disabled above.
      - name: consul-auth-method-sa-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 7200
      {{- end }}
      {{- if and $ci $ci.enabled }}
      # Credential injection (T8): the shared ext_proc socket and non-secret
      # processor config are present for every source. The credential source
      # (Vault Agent-rendered memory volume, or a read-only Kubernetes Secret)
      # is selected below. Credentials must NOT be mounted into Envoy.
      - name: camp-auth-socket
        emptyDir:
          medium: "Memory"
      - name: camp-auth-processor-config
        configMap:
          name: {{ $ci.processorConfigMap | quote }}
      {{- if eq (default "vault" $ci.source) "kubernetesSecret" }}
      # Credentials arrive via a read-only Secret mounted at the rendered path.
      # The volume keeps its name so the processor container is source-agnostic.
      - name: camp-vault-rendered
        secret:
          secretName: {{ required "credentialInjection.secretName is required when source is kubernetesSecret" $ci.secretName | quote }}
      {{- else }}
      - name: camp-vault-rendered
        emptyDir:
          medium: "Memory"
      - name: camp-vault-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: {{ $ci.tokenAudience | default "vault" | quote }}
              {{- if $ci.tokenExpirationSeconds }}
              expirationSeconds: {{ $ci.tokenExpirationSeconds }}
              {{- end }}
      # Private token sink for the Vault Agent (never mounted into the processor
      # or Envoy) and the operator-provided agent config / Vault CA.
      - name: camp-vault-agent-private
        emptyDir:
          medium: "Memory"
      - name: camp-vault-agent-config
        configMap:
          name: {{ $ci.vaultAgentConfigMap | quote }}
      {{- if $ci.vaultCAConfigMap }}
      - name: camp-vault-ca
        configMap:
          name: {{ $ci.vaultCAConfigMap | quote }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range (default $defaults.extraVolumes .extraVolumes) }}
      - name: userconfig-{{ .name }}
        {{ .type }}:
          {{- if (eq .type "configMap") }}
          name: {{ .name }}
          {{- else if (eq .type "secret") }}
          secretName: {{ .name }}
          {{- end }}
          {{- with .items }}
          items:
          {{- range . }}
          - key: {{.key}}
            path: {{.path}}
          {{- end }}
          {{- end }}
      {{- end }}
      {{- if $root.Values.global.tls.enabled }}
      {{- if not (or (and $root.Values.externalServers.enabled $root.Values.externalServers.useSystemRoots) ($root.Values.global.secretsBackend.vault.enabled)) }}
      - name: consul-ca-cert
        secret:
          {{- if $root.Values.global.tls.caCert.secretName }}
          secretName: {{ $root.Values.global.tls.caCert.secretName }}
          {{- else }}
          secretName: {{ template "consul.fullname" $root }}-ca-cert
          {{- end }}
          items:
          - key: {{ default "tls.crt" $root.Values.global.tls.caCert.secretKey }}
            path: tls.crt
      {{- end }}
      {{- end }}
      initContainers:
        # terminating-gateway-init registers the terminating gateway service with Consul.
        - name: terminating-gateway-init
          image: {{ $root.Values.global.imageK8S }}
          {{ template "consul.imagePullPolicy" $root }}
          {{- include "consul.restrictedSecurityContext" $ | nindent 10 }}
          env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          {{- include "consul.consulK8sConsulServerEnvVars" $root | nindent 10 }}
          {{- if $root.Values.global.enableConsulNamespaces }}
          - name: CONSUL_NAMESPACE
            value: {{ include "consul.terminatingGatewayNamespace" (dict "root" $root "gatewayNamespace" .consulNamespace "defaultsNamespace" $defaults.consulNamespace) }}
          {{- end }}
          {{- if $root.Values.global.acls.manageSystemACLs }}
          - name: CONSUL_LOGIN_AUTH_METHOD
            value: {{ template "consul.fullname" $root }}-k8s-component-auth-method
          - name: CONSUL_LOGIN_DATACENTER
            value: {{ $root.Values.global.datacenter }}
          - name: CONSUL_LOGIN_META
            value: "component=terminating-gateway,pod=$(NAMESPACE)/$(POD_NAME)"
          {{- end }}
          - name: CONSUL_NODE_NAME
            value: $(NODE_NAME)-virtual
          command:
            - "/bin/sh"
            - "-ec"
            - |
              exec consul-k8s-control-plane connect-init -pod-name=${POD_NAME} -pod-namespace=${NAMESPACE} \
                  -gateway-kind="terminating-gateway" \
                  -proxy-id-file=/consul/service/proxy-id \
                  -service-name={{ .name }} \
                  -log-level={{ default $root.Values.global.logLevel $root.Values.terminatingGateways.logLevel }} \
                  -log-json={{ $root.Values.global.logJSON }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: consul-service
              mountPath: /consul/service
            {{- if and $ci $ci.enabled $root.Values.global.acls.manageSystemACLs }}
            - name: consul-auth-method-sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            {{- if $root.Values.global.tls.enabled }}
            {{- if not (or (and $root.Values.externalServers.enabled $root.Values.externalServers.useSystemRoots) ($root.Values.global.secretsBackend.vault.enabled)) }}
            - name: consul-ca-cert
              mountPath: /consul/tls/ca
              readOnly: true
            {{- end }}
            {{- end }}
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "50Mi"
              cpu: "50m"
        {{- if and $ci $ci.enabled }}
        {{- if ne (default "vault" $ci.source) "kubernetesSecret" }}
        {{- include "consul.terminatingGatewayCredentialVaultAgent" (dict "name" "camp-vault-agent-init" "exitAfterAuth" true "ci" $ci "root" $root) | nindent 8 }}
        {{- end }}
        {{- end }}
      containers:
        - name: terminating-gateway
          image: {{ $root.Values.global.imageConsulDataplane | quote }}
          {{ template "consul.imagePullPolicy" $root }}
          {{- include "consul.restrictedSecurityContext" $ | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: consul-service
              mountPath: /consul/service
              readOnly: true
            {{- if and $ci $ci.enabled $root.Values.global.acls.manageSystemACLs }}
            - name: consul-auth-method-sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            {{- if $root.Values.global.tls.enabled }}
            {{- if not (or (and $root.Values.externalServers.enabled $root.Values.externalServers.useSystemRoots) ($root.Values.global.secretsBackend.vault.enabled)) }}
            - name: consul-ca-cert
              mountPath: /consul/tls/ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- range (default $defaults.extraVolumes .extraVolumes) }}
            - name: userconfig-{{ .name }}
              readOnly: true
              mountPath: /consul/userconfig/{{ .name }}
            {{- end }}
            {{- if and $ci $ci.enabled }}
            # Envoy reaches the credential processor over this UDS only. It must
            # never mount the rendered credentials or the Vault token volumes.
            - name: camp-auth-socket
              mountPath: /consul/auth-socket
            {{- end }}
          {{- if (default $defaults.resources .resources) }}
          resources: {{ toYaml (default $defaults.resources .resources) | nindent 12 }}
          {{- end }}
          env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: DP_CREDENTIAL_LOGIN_META1
            value: pod=$(NAMESPACE)/$(POD_NAME)
          - name: DP_CREDENTIAL_LOGIN_META2
            value: component=terminating-gateway
          - name: DP_SERVICE_NODE_NAME
            value: $(NODE_NAME)-virtual
          - name: DP_ENVOY_READY_BIND_ADDRESS
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          command:
          - consul-dataplane
          args:
          {{- if $root.Values.externalServers.enabled }}
          - -addresses={{ $root.Values.externalServers.hosts | first }}
          {{- else }}
          - -addresses={{ template "consul.fullname" $root }}-server.{{ $root.Release.Namespace }}.svc
          {{- end }}
          {{- if $root.Values.externalServers.enabled }}
          - -grpc-port={{ $root.Values.externalServers.grpcPort }}
          {{- else }}
          - -grpc-port=8502
          {{- end }}
          - -proxy-service-id-path=/consul/service/proxy-id
          {{- if $root.Values.global.enableConsulNamespaces }}
          - -service-namespace={{ include "consul.terminatingGatewayNamespace" (dict "root" $root "gatewayNamespace" .consulNamespace "defaultsNamespace" $defaults.consulNamespace) }}
          {{- end }}
          {{- if and $root.Values.global.tls.enabled }}
          {{- if (not (and $root.Values.externalServers.enabled $root.Values.externalServers.useSystemRoots)) }}
          {{- if $root.Values.global.secretsBackend.vault.enabled }}
          - -ca-certs=/vault/secrets/serverca.crt
          {{- else }}
          - -ca-certs=/consul/tls/ca/tls.crt
          {{- end }}
          {{- end }}
          {{- if and $root.Values.externalServers.enabled $root.Values.externalServers.tlsServerName }}
          - -tls-server-name={{$root.Values.externalServers.tlsServerName }}
          {{- end }}
          {{- else }}
          - -tls-disabled
          {{- end }}
          {{- if $root.Values.global.acls.manageSystemACLs }}
          - -credential-type=login
          - -login-bearer-token-path=/var/run/secrets/kubernetes.io/serviceaccount/token
          - -login-auth-method={{ template "consul.fullname" $root }}-k8s-component-auth-method
          {{- if $root.Values.global.adminPartitions.enabled }}
          - -login-partition={{ $root.Values.global.adminPartitions.name }}
          {{- end }}
          {{- end }}
          {{- if $root.Values.global.adminPartitions.enabled }}
          - -service-partition={{ $root.Values.global.adminPartitions.name }}
          {{- end }}
          - -log-level={{ default $root.Values.global.logLevel $root.Values.terminatingGateways.logLevel }}
          - -log-json={{ $root.Values.global.logJSON }}
          {{- if (and $root.Values.global.metrics.enabled $root.Values.global.metrics.enableGatewayMetrics) }}
          - -telemetry-prom-scrape-path=/metrics
          {{- end }}
          {{- if and $root.Values.externalServers.enabled $root.Values.externalServers.skipServerWatch }}
          - -server-watch-disabled=true
          {{- end }}
          {{- if $root.Values.global.dualStack.enabled }}
          - "-envoy-admin-bind-address=::1"
          - "-xds-bind-addr=::1"
          - "-graceful-addr=::1"
          - "-consul-dns-bind-addr=::1"
          {{- else }}
          - -envoy-admin-bind-address=127.0.0.1
          - -xds-bind-addr=127.0.0.1
          - -graceful-addr=127.0.0.1
          - -consul-dns-bind-addr=127.0.0.1
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: 8443
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8443
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          ports:
            - name: gateway
              containerPort: 8443
        {{- if and $ci $ci.enabled }}
        {{- if ne (default "vault" $ci.source) "kubernetesSecret" }}
        {{- include "consul.terminatingGatewayCredentialVaultAgent" (dict "name" "camp-vault-agent" "exitAfterAuth" false "ci" $ci "root" $root) | nindent 8 }}
        {{- end }}
        {{- include "consul.terminatingGatewayCredentialAuthProcessor" (dict "ci" $ci "logLevel" (default $root.Values.global.logLevel $root.Values.terminatingGateways.logLevel) "drainSeconds" $drainSeconds "root" $root) | nindent 8 }}
        {{- end }}
      {{- if (default $defaults.priorityClassName .priorityClassName) }}
      priorityClassName: {{ (default $defaults.priorityClassName .priorityClassName) | quote }}
      {{- end }}
      {{- if (default $defaults.nodeSelector .nodeSelector) }}
      nodeSelector:
        {{ tpl (default $defaults.nodeSelector .nodeSelector) $root | indent 8 | trim }}
      {{- end }}
---
{{- end }}
{{- end }}
