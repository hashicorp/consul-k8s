apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "consul.fullname" . }}-ai-mcp-server-resources
  labels:
    app: {{ template "consul.name" . }}
    chart: {{ template "consul.chart" . }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
    component: ai-mcp-server
rules:
  - apiGroups:
      - consul.hashicorp.com
    resources:
      - mcpserverconfigs
    verbs:
      - get
      - create
      - update
{{- end }}
