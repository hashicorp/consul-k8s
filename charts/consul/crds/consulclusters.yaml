apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app: consul
    chart: consul-helm
    heritage: Helm

    component: crd
  name: consulclusters.consul.hashicorp.com
spec:
  group: consul.hashicorp.com
  names:
    kind: ConsulCluster
    listKind: ConsulClusterList
    plural: consulclusters
    shortNames:
    - consulcluster
    singular: consulcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Lifecycle phase of the cluster
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Desired number of server pods
      jsonPath: .spec.size
      name: Size
      type: integer
    - description: Number of ready server pods
      jsonPath: .status.readyCount
      name: Ready
      type: integer
    - description: Consul version
      jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ConsulCluster manages a Consul server cluster as individual pods and PVCs.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: ConsulClusterSpec defines the desired state of a ConsulCluster.
            properties:
              bootstrapExpect:
                description: How many servers must connect before electing a leader. Defaults to size.
                type: integer
              connect:
                description: Enable the Consul service mesh on server agents.
                type: boolean
              datacenterName:
                description: Consul datacenter name. Defaults to "dc1".
                type: string
              enableAgentDebug:
                description: Enable the pprof debug endpoint on server agents.
                type: boolean
              exposeGossipAndRPCPorts:
                description: Expose gossip and RPC ports as hostPorts.
                type: boolean
              exposeService:
                description: Creates an additional LoadBalancer or NodePort Service exposing the Consul API outside the cluster.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Extra annotations for the expose service.
                    type: object
                  enabled:
                    description: Enabled creates the expose service.
                    type: boolean
                  nodePort:
                    description: Per-port NodePort values when type is NodePort.
                    properties:
                      grpc:
                        format: int32
                        type: integer
                      http:
                        format: int32
                        type: integer
                      https:
                        format: int32
                        type: integer
                      rpc:
                        format: int32
                        type: integer
                      serf:
                        format: int32
                        type: integer
                    type: object
                  type:
                    description: Kubernetes Service type - LoadBalancer or NodePort.
                    type: string
                type: object
              extraConfig:
                description: Raw JSON string merged into the server configuration.
                type: string
              gossipEncryption:
                description: Gossip encryption key configuration.
                properties:
                  secretKey:
                    description: Key within the Secret that holds the gossip encryption key.
                    type: string
                  secretName:
                    description: Name of a Kubernetes Secret containing the gossip encryption key.
                    type: string
                required:
                - secretName
                type: object
              image:
                description: Container image override. When empty the operator uses "hashicorp/consul:<version>".
                type: string
              limits:
                description: Rate limiting configuration for the Consul server agents.
                properties:
                  requestLimits:
                    description: Per-request rate limits on the server.
                    properties:
                      mode:
                        description: Rate limiting mode - disabled, permissive, or enforce.
                        type: string
                      readRate:
                        description: Maximum sustained read requests per second. -1 means unlimited.
                        type: number
                      writeRate:
                        description: Maximum sustained write requests per second. -1 means unlimited.
                        type: number
                    type: object
                type: object
              logLevel:
                description: Consul agent log level (trace, debug, info, warn, error).
                type: string
              metrics:
                description: Prometheus metrics configuration.
                properties:
                  enabled:
                    description: Adds Prometheus scrape annotations to server pods.
                    type: boolean
                  retentionTime:
                    description: Prometheus metrics retention time. Defaults to "60s".
                    type: string
                type: object
              paused:
                description: Suspends reconciliation without deleting the cluster.
                type: boolean
              persistentVolumeClaimRetentionPolicy:
                description: Controls PVC lifecycle on scale-down and cluster deletion. Defaults to Delete for both.
                properties:
                  whenDeleted:
                    description: What to do with PVCs when the ConsulCluster CR is deleted. Delete or Retain.
                    enum:
                    - Delete
                    - Retain
                    type: string
                  whenScaled:
                    description: What to do with PVCs when the cluster is scaled down. Delete or Retain.
                    enum:
                    - Delete
                    - Retain
                    type: string
                type: object
              pod:
                description: Pod-level settings for server pods.
                properties:
                  affinity:
                    description: Affinity defines pod scheduling affinity rules.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  annotations:
                    additionalProperties:
                      type: string
                    description: Extra annotations to apply to server pods.
                    type: object
                  containerSecurityContext:
                    description: Override the consul container's security context.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  extraContainers:
                    description: Additional sidecar containers to run alongside consul.
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                  extraEnvVars:
                    description: Additional environment variables for the consul container.
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                  extraVolumeMounts:
                    description: Additional volume mounts for the consul container.
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                  extraVolumes:
                    description: Additional volumes to attach to server pods.
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                  imagePullSecrets:
                    description: References to secrets for pulling the consul image.
                    items:
                      properties:
                        name:
                          type: string
                      type: object
                    type: array
                  labels:
                    additionalProperties:
                      type: string
                    description: Extra labels to apply to server pods.
                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector constrains pod scheduling to matching nodes.
                    type: object
                  resources:
                    description: CPU and memory requests/limits for the consul container.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  securityContext:
                    description: Override the pod-level security context.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  tolerations:
                    description: Tolerations for node taints.
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                  topologySpreadConstraints:
                    description: Topology spread constraints for server pods.
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                type: object
              podDisruptionBudget:
                description: PodDisruptionBudget configuration for server pods.
                properties:
                  enabled:
                    description: Creates a PodDisruptionBudget for server pods.
                    type: boolean
                  maxUnavailable:
                    description: Maximum number of pods that can be unavailable during disruptions. Defaults to 1.
                    type: integer
                type: object
              priorityClassName:
                description: PriorityClass to assign to server pods.
                type: string
              serviceAccountAnnotations:
                additionalProperties:
                  type: string
                description: Extra annotations applied to the server ServiceAccount.
                type: object
              serviceAnnotations:
                additionalProperties:
                  type: string
                description: Extra annotations applied to the headless and client services.
                type: object
              size:
                description: Number of server pods to run.
                minimum: 1
                type: integer
              storage:
                anyOf:
                - type: integer
                - type: string
                description: Size of each server's PVC.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              storageClassName:
                description: Storage class for server PVCs. Uses cluster default when unset.
                type: string
              tls:
                description: TLS configuration for the server cluster.
                properties:
                  caSecretName:
                    description: Name of a Kubernetes Secret containing the CA certificate under key "tls.crt".
                    type: string
                  enabled:
                    description: Enables TLS for the server cluster.
                    type: boolean
                  httpsOnly:
                    description: Disable the plain HTTP port (8500) when TLS is enabled.
                    type: boolean
                  serverCertSecretName:
                    description: Name of a Kubernetes Secret containing the server TLS cert and key under keys "tls.crt" and "tls.key".
                    type: string
                type: object
              version:
                description: Consul version to run, e.g. "1.18.0".
                type: string
            required:
            - size
            - version
            type: object
          status:
            description: ConsulClusterStatus defines the observed state of a ConsulCluster.
            properties:
              conditions:
                description: Latest available observations of the cluster's state.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              currentVersion:
                description: Consul image version running across the cluster.
                type: string
              members:
                description: Names of all server pods in the cluster.
                items:
                  type: string
                type: array
              phase:
                description: "Lifecycle phase: Creating | Running | Upgrading | Failed"
                type: string
              readyCount:
                description: Number of ready server pods.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
