apiVersion: consul.hashicorp.com/v1beta1
kind: HTTPRoute
metadata:
  name: frontend-route-consul
  namespace: consul
spec:
  parentRefs:
    - group: consul.hashicorp.com
      kind: Gateway
      name: consul-api-gateway
  rules:
    - backendRefs:
      - kind: Service
        name: frontend
        namespace: frontend
        port: 8080
---
apiVersion: consul.hashicorp.com/v1beta1
kind: ReferenceGrant
metadata:
  name: service-grant-consul
  namespace: frontend
spec:
  from:
  - group: consul.hashicorp.com
    kind: HTTPRoute
    namespace: consul
  to:
  - group: ""
    kind: Service
    name: frontend
