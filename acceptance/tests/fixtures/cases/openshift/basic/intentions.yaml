apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: to-backend-default
  namespace: default
  labels:
    consul.hashicorp.com/acceptance-namespace: consul
spec:
  destination:
    name: backend
  sources:
    - name: frontend
      action: allow
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: to-frontend-default
  namespace: default
  labels:
    consul.hashicorp.com/acceptance-namespace: consul
spec:
  destination:
    name: frontend
  sources:
    - name: api-gateway
      action: allow
