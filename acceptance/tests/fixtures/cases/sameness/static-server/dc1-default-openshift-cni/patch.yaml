# OpenShift + CNI overlay for the sameness static-server fixture.
# Adds the Multus consul-cni network annotation so the consul-cni plugin runs for
# this pod and installs the transparent-proxy iptables (including the Consul DNS
# redirect). It is layered on top of the base fixture so the per-cluster -text used
# for failover verification is preserved.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-server
spec:
  template:
    metadata:
      annotations:
        "k8s.v1.cni.cncf.io/networks": '[{ "name":"consul-cni" }]'
