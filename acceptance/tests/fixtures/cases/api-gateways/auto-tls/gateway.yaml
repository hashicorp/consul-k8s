# Zero-touch downstream TLS termination: the gateway opts into Consul-managed
# TLS via the tls-enabled annotation and attaches NO custom certificate to the
# listener. The gateway must terminate downstream HTTPS using its auto-issued
# Connect leaf certificate, whose SANs include "*.api-gateway.<domain>".
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: auto-tls-gateway
  labels:
    component: api-gateway
  annotations:
    consul.hashicorp.com/tls-enabled: "true"
spec:
  gatewayClassName: auto-tls-gateway-class
  listeners:
  - protocol: HTTPS
    port: 8443
    name: https
    tls:
      mode: Terminate
      # No certificateRefs: the leaf cert is issued by Consul Connect. Gateway
      # API >= v1.4 CRDs enforce that a Terminate listener sets certificateRefs
      # or options, so pin the (default) TLS_AUTO minimum version to satisfy
      # that rule without altering the gateway's TLS behaviour.
      options:
        api-gateway.consul.hashicorp.com/tls_min_version: "TLS_AUTO"
    allowedRoutes:
      namespaces:
        from: "All"
