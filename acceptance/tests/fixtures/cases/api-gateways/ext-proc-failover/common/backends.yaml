# ── connect-proxy ext-proc chain: service-d1 -> service-e1 -> service-f/g ─────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-d1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-d1
  labels:
    app: service-d1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-d1
  template:
    metadata:
      labels:
        app: service-d1
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        consul.hashicorp.com/consul-dns: "true"
    spec:
      serviceAccountName: service-d1
      containers:
        - name: service-d
          image: local/service-d:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: UPSTREAM_E
              value: http://service-e1.virtual.consul:8080
---
apiVersion: v1
kind: Service
metadata:
  name: service-d1
spec:
  selector:
    app: service-d1
  ports:
    - name: http
      appProtocol: http
      port: 8080
      targetPort: 8080
---
# service-e1 runs the HTTP connect-proxy ext-proc as a SIDECAR (127.0.0.1:9000).
# Its ServiceDefaults points the inbound ext-proc filter at that localhost URI.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-e1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-e1
  labels:
    app: service-e1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-e1
  template:
    metadata:
      labels:
        app: service-e1
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        consul.hashicorp.com/consul-dns: "true"
    spec:
      serviceAccountName: service-e1
      containers:
        # service-e1 app container.
        - name: service-e
          image: local/service-e:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: UPSTREAM_F
              value: http://service-f.virtual.consul:8080
            - name: UPSTREAM_G
              value: http://service-g.virtual.consul:8080
            - name: UPSTREAM_A
              value: http://service-a.virtual.consul:8080
        # HTTP ext-proc sidecar. Envoy's inbound listener calls this over
        # localhost (127.0.0.1:9000); it then consults http-decider-connect-proxy
        # over the mesh (as service-e1's identity) to pick service-f/service-g.
        - name: ext-proc-http-connect-proxy
          image: local/ext-proc-http-connect-proxy:0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ROUTER_URL
              value: http://http-decider-connect-proxy.virtual.consul:9500/decide
            - name: ROUTER_TIMEOUT_MS
              value: "5000"
          ports:
            - name: ext-proc
              containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: service-e1
spec:
  selector:
    app: service-e1
  ports:
    - name: http
      appProtocol: http
      port: 8080
      targetPort: 8080
