# Backends shared by the single- and two-ext-proc gateway scenarios.
#
#   service-a/b/c : gateway ext-proc HTTP targets (plain http-echo).
#   service-f/g   : connect-proxy ext-proc HTTP fan-out targets (plain http-echo).
#   service-d1    : pure forwarder; receives /dd1 from the gateway and proxies to
#                   service-e1 over the mesh.
#   service-e1    : receives the request; its inbound connect-proxy runs the HTTP
#                   ext-proc sidecar (127.0.0.1:9000), then the app reads
#                   x-route-target and proxies to service-f/service-g.
#
# All in-mesh services use transparent-proxy + Consul DNS so they reach each
# other (and their cross-cluster failover targets) at <name>.virtual.consul.
#
# NOTE: service-d1, service-e1 and the ext-proc-http-connect-proxy sidecar use
# the images built from ../apps (local/*). Build them and load them into BOTH
# kind clusters before running this test (see ../apps/README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  labels:
    app: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        consul.hashicorp.com/consul-dns: "true"
    spec:
      serviceAccountName: service-a
      containers:
        - name: service-a
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:8080", "-text=hello from service-a"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  selector:
    app: service-a
  ports:
    - name: http
      port: 8080
      targetPort: 8080
