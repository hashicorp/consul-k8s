apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared resources for both the single- and two-ext-proc gateway scenarios:
# gateway class, backends, ext-proc processors/deciders, mesh services,
# protocols, the connect-proxy ext-proc, RouteExtProc CRDs and intentions.
resources:
  - gatewayclassconfig.yaml
  - gatewayclass.yaml
  - backends.yaml
  - ext-components.yaml
  - meshservices.yaml
  - servicedefaults-protocols.yaml
  - servicedefaults-connect-proxy.yaml
  - routeextproc.yaml
  - intentions.yaml
