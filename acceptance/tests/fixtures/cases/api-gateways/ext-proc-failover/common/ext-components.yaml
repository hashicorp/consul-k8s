# ext-proc processors and deciders shared by the single- and two-ext-proc
# gateway scenarios.
#
#   route-decider              : HTTP decider for the gateway. Maps :path
#                                (suffix /b->service-b, /c->service-c, else
#                                service-a). Consulted by BOTH gateway processors.
#   ext-proc-http              : HTTP Envoy ExternalProcessor used as the
#                                single-instance gateway processor AND as the
#                                "base" instance of the two-instance gateway.
#   ext-proc-http-path         : A SECOND HTTP Envoy ExternalProcessor used as the
#                                "path" instance of the two-instance gateway. Kept
#                                distinct from ext-proc-http so its logs can be
#                                inspected in isolation to prove that /ext_proc/*
#                                requests reach the path processor while the
#                                /ext_proc/aa|bb|cc bypass routes do NOT.
#   http-decider-connect-proxy : HTTP decider for the mesh path; randomly returns
#                                service-f or service-g (consulted by the
#                                service-e1 ext-proc-http sidecar).
#
# These use the images built from ../apps (local/*); build + kind load them into
# BOTH clusters before running the test (see ../apps/README.md). ext-proc-http-path
# reuses the local/ext-proc-http image.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: route-decider
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-decider
  labels:
    app: route-decider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-decider
  template:
    metadata:
      labels:
        app: route-decider
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        consul.hashicorp.com/consul-dns: "true"
    spec:
      serviceAccountName: route-decider
      containers:
        - name: route-decider
          image: local/route-decider:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9500
---
apiVersion: v1
kind: Service
metadata:
  name: route-decider
spec:
  selector:
    app: route-decider
  ports:
    - name: http
      appProtocol: http
      port: 9500
      targetPort: 9500
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ext-proc-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-proc-http
  labels:
    app: ext-proc-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-proc-http
  template:
    metadata:
      labels:
        app: ext-proc-http
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        consul.hashicorp.com/consul-dns: "true"
    spec:
      serviceAccountName: ext-proc-http
      containers:
        - name: ext-proc-http
          image: local/ext-proc-http:0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ROUTER_URL
              value: http://route-decider.virtual.consul:9500/decide
            - name: ROUTER_TIMEOUT_MS
              value: "5000"
          ports:
            - name: http
              containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: ext-proc-http
spec:
  selector:
    app: ext-proc-http
  ports:
    - name: http
      appProtocol: http
      port: 9000
      targetPort: 9000
---
# ext-proc-http-path: the "path" instance of the two-ext-proc gateway. Same image
# and decider as ext-proc-http, but a distinct Deployment/Service so its logs can
# be inspected on their own (see the two-ext-proc negative bypass assertions).
