# Protocol ServiceDefaults for every in-mesh backend, processor and decider.
# ext-proc requires HTTP so Envoy can parse the request and run the external
# processing filter. Shared by both gateway scenarios.
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: service-a
spec:
  protocol: http
