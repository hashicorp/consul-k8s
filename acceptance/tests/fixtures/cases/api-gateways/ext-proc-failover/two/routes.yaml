# Path default: carries the initial (header-less) /ext_proc request into the path
# processor (only base is disabled).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: two-path-default-route
  namespace: default
spec:
  parentRefs:
    - name: api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ext_proc
      filters:
        - type: ExtensionRef
          extensionRef: { group: consul.hashicorp.com, kind: RouteExtProc, name: disable-base }
      backendRefs:
        - group: consul.hashicorp.com
          kind: MeshService
          name: service-a-mesh
          namespace: default
          port: 8080
---
# ── /ext_proc bypass (/ext_proc/aa|/bb|/cc) — negative case for path processor ─
# More specific than "/ext_proc", so these match first and route statically with
# BOTH instances disabled. The path processor must NOT be consulted for these
# (proven by inspecting the ext-proc-http-path logs). Note /ext_proc/bb routes to
# service-b and /ext_proc/cc to service-c: had the path processor run, its suffix
# rule (/bb, /cc are not /b or /c) would have chosen service-a instead — so the
# response body alone distinguishes the bypass for bb/cc.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: two-path-bypass-aa-route
  namespace: default
spec:
  parentRefs:
    - name: api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ext_proc/aa
      filters:
        - type: ExtensionRef
          extensionRef: { group: consul.hashicorp.com, kind: RouteExtProc, name: disable-base }
        - type: ExtensionRef
          extensionRef: { group: consul.hashicorp.com, kind: RouteExtProc, name: disable-path }
      backendRefs:
        - group: consul.hashicorp.com
          kind: MeshService
          name: service-a-mesh
          namespace: default
          port: 8080
---
