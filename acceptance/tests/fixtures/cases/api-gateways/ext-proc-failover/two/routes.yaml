# HTTPRoutes for the TWO-ext-proc gateway (api-gateway). Both ext-proc instances
# (base + path) are enabled-by-default, so every route disables the instance it
# does not want via a RouteExtProc ExtensionRef (../common/routeextproc.yaml).
#
# Path families:
#   bare  /a|/b|/c            -> base processor (ext-proc-http) decides; disable-path
#   /ext_proc/a|/b|/c         -> path processor (ext-proc-http-path) decides; disable-base
#   /aa|/bb|/cc               -> static bypass (disable base AND path)
#   /ext_proc/aa|/bb|/cc      -> static bypass (disable base AND path)
#   /dd1                      -> connect-proxy ext-proc chain (disable base AND path)

# ── base family (bare paths, base processor) ─────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: two-base-service-a-route
  namespace: default
spec:
  parentRefs:
    - name: api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: x-route-target
              value: service-a
      filters:
        - type: ExtensionRef
          extensionRef: { group: consul.hashicorp.com, kind: RouteExtProc, name: disable-path }
      backendRefs:
        - group: consul.hashicorp.com
          kind: MeshService
          name: service-a-mesh
          namespace: default
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: two-base-service-b-route
  namespace: default
spec:
