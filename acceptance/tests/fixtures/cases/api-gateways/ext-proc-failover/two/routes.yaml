---
# ── connect-proxy ext-proc chain (/dd1) ──────────────────────────────────────
# /dd1 -> service-d1 (forwarder) -> service-e1. service-e1's inbound connect-proxy
# runs the HTTP ext-proc sidecar which fans out to service-f/service-g. Both
# gateway instances are disabled here so only the connect-proxy ext-proc runs.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: two-service-d1-route
  namespace: default
spec:
  parentRefs:
    - name: api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dd1
      filters:
        - type: ExtensionRef
          extensionRef: { group: consul.hashicorp.com, kind: RouteExtProc, name: disable-base }
        - type: ExtensionRef
          extensionRef: { group: consul.hashicorp.com, kind: RouteExtProc, name: disable-path }
      backendRefs:
        - group: consul.hashicorp.com
          kind: MeshService
          name: service-d1-mesh
          namespace: default
          port: 8080
