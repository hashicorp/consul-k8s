---
# Base default: carries the initial (header-less) bare request into the base
# processor (only path is disabled) and is the fallback target.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: two-base-default-route
  namespace: default
spec:
  parentRefs:
    - name: api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef: { group: consul.hashicorp.com, kind: RouteExtProc, name: disable-path }
      backendRefs:
        - group: consul.hashicorp.com
          kind: MeshService
          name: service-a-mesh
          namespace: default
          port: 8080
---
# ── bare bypass (/aa|/bb|/cc) — negative case for the base processor ──────────
# More specific than "/", so Envoy matches these first and routes statically.
# Both instances are disabled, so neither processor is consulted.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: two-bypass-aa-route
  namespace: default
spec:
  parentRefs:
    - name: api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /aa
      filters:
        - type: ExtensionRef
          extensionRef: { group: consul.hashicorp.com, kind: RouteExtProc, name: disable-base }
        - type: ExtensionRef
          extensionRef: { group: consul.hashicorp.com, kind: RouteExtProc, name: disable-path }
      backendRefs:
        - group: consul.hashicorp.com
          kind: MeshService
          name: service-a-mesh
          namespace: default
          port: 8080
---
