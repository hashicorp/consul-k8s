# Route that force-enables ext_authz via an ExtensionRef RouteAuthFilter.
# Expected: HTTPRouteConfigEntry.Rules[0].Filters.ExtAuthz.Enabled == true
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-authz-enabled
spec:
  parentRefs:
  - name: gateway
    sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/protected"
      backendRefs:
        - name: static-server
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: consul.hashicorp.com
            kind: RouteAuthFilter
            name: ext-authz-enabled
---
# Route that force-disables ext_authz via an ExtensionRef RouteAuthFilter.
# Expected: HTTPRouteConfigEntry.Rules[0].Filters.ExtAuthz.Enabled == false
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-authz-disabled
spec:
  parentRefs:
  - name: gateway
    sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/public"
      backendRefs:
        - name: static-server
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: consul.hashicorp.com
            kind: RouteAuthFilter
            name: ext-authz-disabled
---
# Route with no RouteAuthFilter; it inherits the gateway-wide posture.
# Expected: HTTPRouteConfigEntry.Rules[0].Filters.ExtAuthz == nil
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-authz-inherit
spec:
  parentRefs:
  - name: gateway
    sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/inherit"
      backendRefs:
        - name: static-server
          port: 8080
