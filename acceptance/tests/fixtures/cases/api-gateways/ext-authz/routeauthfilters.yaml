apiVersion: consul.hashicorp.com/v1alpha1
kind: RouteAuthFilter
metadata:
  name: ext-authz-enabled
spec:
  # Force-enable the ext_authz check for routes that reference this filter,
  # overriding the gateway-wide "disabled" posture.
  extAuthz:
    enabled: true
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: RouteAuthFilter
metadata:
  name: ext-authz-disabled
spec:
  # Force-skip the ext_authz check for routes that reference this filter.
  extAuthz:
    enabled: false
