# h2-server — backend behind the HTTP/2 listener.
#
# Same approach as grpc-server: we use the lightweight hashicorp/http-echo
# image and set ServiceDefaults.protocol == "http2".  The gateway config-entry
# test only needs a registered mesh service with the correct ServiceDefaults;
# actual HTTP/2 wire traffic is out of scope for this test.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: h2-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: h2-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: h2-server
  template:
    metadata:
      name: h2-server
      labels:
        app: h2-server
      annotations:
        consul.hashicorp.com/connect-inject: "true"
    spec:
      serviceAccountName: h2-server
      terminationGracePeriodSeconds: 0
      containers:
        - name: h2-server
          image: docker.mirror.hashicorp.services/hashicorp/http-echo:alpine
          args:
            - -text="h2-server hello"
            - -listen=:8090
          ports:
            - containerPort: 8090
              name: http2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          readinessProbe:
            httpGet:
              port: 8090
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: h2-server
spec:
  selector:
    app: h2-server
  ports:
    - name: http2
      port: 8090
      targetPort: 8090
