apiVersion: consul.hashicorp.com/v1alpha1
kind: GatewayClassConfig
metadata:
  name: multi-listener-gwcc
spec:
  # Map privileged ports so the gateway pods run without elevated privileges
  # under both default and restricted PodSecurity Admission policies.
  mapPrivilegedContainerPorts: 8000
