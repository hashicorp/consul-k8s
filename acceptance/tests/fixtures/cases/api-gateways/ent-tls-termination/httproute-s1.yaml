# Plain route: no hostnames — proxies all traffic to static-server (s1 role).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ent-tls-termination-route-s1
spec:
  parentRefs:
  - name: ent-tls-termination-gateway
  rules:
  - backendRefs:
    - name: static-server
      port: 80
