# HTTPRoute that references the RouteUpstreamLimitsFilter via a backendRef
# extensionRef filter.  This is the canonical way to attach per-service limits.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: limits-route
  namespace: default
spec:
  parentRefs:
    - name: limits-gateway
      namespace: default
  rules:
    - backendRefs:
        - name: static-server
          port: 80
          filters:
            - type: ExtensionRef
              extensionRef:
                group: consul.hashicorp.com
                kind: RouteUpstreamLimitsFilter
                name: static-server-limits
