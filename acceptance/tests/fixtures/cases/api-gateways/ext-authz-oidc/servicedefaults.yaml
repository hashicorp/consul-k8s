# Applies the builtin/ext-authz Envoy extension to the API gateway proxy, using
# an HTTP authorization service (oauth2-proxy) rather than a gRPC one.
#
# ProxyType: api-gateway is an Enterprise-only capability.
#
# The gateway's Envoy calls oauth2-proxy's root path for every request:
#   - a valid OIDC bearer token  -> oauth2-proxy returns 200 (allow). Envoy's
#     HTTP ext_authz only treats 200 as OK, which is why oauth2-proxy is run with
#     --upstream=static://200.
#   - no / invalid token         -> oauth2-proxy returns a 302 redirect to Dex,
#     which Envoy treats as a DENY.
#
# AllowedClientHeadersOnSuccess copies the authenticated identity
# (x-auth-request-email) onto the downstream response so a client can observe
# who Dex authenticated without an echo upstream.
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: gateway
spec:
  protocol: http
  envoyExtensions:
    - name: builtin/ext-authz
      required: true
      arguments:
        ProxyType: api-gateway
        Config:
          HttpService:
            Target:
              URI: oauth2-proxy:4180
              Timeout: 5s
            AuthorizationRequest:
              AllowedHeaders:
                - Exact: authorization
                - Exact: cookie
            AuthorizationResponse:
              AllowedUpstreamHeaders:
                - Exact: x-auth-request-user
                - Exact: x-auth-request-email
              AllowedClientHeadersOnSuccess:
                - Exact: x-auth-request-email
