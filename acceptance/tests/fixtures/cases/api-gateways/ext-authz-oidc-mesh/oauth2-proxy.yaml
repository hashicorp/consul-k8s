#
# WITHIN-MESH variant of the OIDC ext_authz backend.
#
# Unlike the out-of-mesh scenario (which reaches oauth2-proxy via Target.URI),
# here oauth2-proxy is a full mesh service: it gets a Connect sidecar, and the
# gateway dials it over mTLS via the builtin/ext-authz extension's
# HttpService.Target.Service (see servicedefaults.yaml). This exercises HTTP
# ext_authz where the auth backend lives inside the mesh.
#
# oauth2-proxy behaviour is identical to the out-of-mesh scenario:
#   - 200 (allow)   when the request carries a valid OIDC bearer token issued by
#                   Dex. On success it emits X-Auth-Request-User /
#                   X-Auth-Request-Email which the extension copies onto the
#                   upstream request and (for x-auth-request-email) the
#                   downstream response.
#   - 302 (deny)    when there is no valid token. Envoy treats any non-200 as a
#                   DENY, so the client is blocked.
#
# --upstream=static://200 makes the authenticated root path return 200 (Envoy's
# HTTP ext_authz only treats 200 as OK).
#
# --skip-jwt-bearer-tokens lets a caller authenticate purely with a bearer token
# minted from Dex, so the whole flow is testable headlessly (no browser).
#
# Dex is NOT in the mesh, so oauth2-proxy's outbound OIDC discovery/token calls
# to dex:5556 are excluded from transparent-proxy redirection and go direct.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth2-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
      annotations:
        "consul.hashicorp.com/connect-inject": "true"
        # Dex is a plain (non-mesh) Service; let oauth2-proxy reach it directly.
        "consul.hashicorp.com/transparent-proxy-exclude-outbound-ports": "5556"
    spec:
      serviceAccountName: oauth2-proxy
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=http://dex:5556/dex
            - --client-id=oauth2-proxy
            - --client-secret=oauth2-proxy-secret
            # Test-only cookie secret (32 bytes, base64). Regenerate for anything real.
            - --cookie-secret=yK2qNMigE18uYzCcly4bBSI6MW35ZjhXLYfJuK4gGt0=
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            # Envoy's ext_authz check hits oauth2-proxy's root path. On success
            # the reverse-proxy returns this static upstream's status (200 =
            # allow); unauthenticated requests get a 302 redirect to Dex instead.
            - --upstream=static://200
            # Accept OIDC bearer tokens from the Dex issuer (headless auth).
            - --skip-jwt-bearer-tokens=true
            - --skip-provider-button=true
            - --reverse-proxy=true
            # Emit X-Auth-Request-User / X-Auth-Request-Email response headers.
            - --set-xauthrequest=true
            - --cookie-secure=false
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
    - port: 4180
      targetPort: 4180
