# Routes all traffic to the static-server upstream. With gateway-wide ext_authz
# enabled, requests must carry a valid Dex-issued OIDC bearer token to reach it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: static-server-route
spec:
  parentRefs:
  - name: gateway
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: static-server
      port: 80
