apiVersion: v1
kind: ConfigMap
metadata:
  name: static-server-config
data:
  config: |
    {
      local_certs
      skip_install_trust
      auto_https disable_redirects
    }
    # Serve TLS for the Service name in the pod's own namespace (static-server.default
    # unless the tests run elsewhere, e.g. consul-test on OpenShift).
    static-server.{$POD_NAMESPACE} {
      log
      respond  "hello world"
    }
    :443 {
      log
      respond  "hello world"
    }
    :80 {
      log
      respond  "hello world"
    }