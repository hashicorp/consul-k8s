# Dispatch to the consul-k8s-workflows when a PR is created and on merges to main/release*
name: pr
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches:
      - main
      - "release/**"

permissions:
  contents: write
  pull-requests: write
  id-token: write

  
# these should be the only settings that you will ever need to change
env:
  BRANCH: ${{ github.head_ref || github.ref_name }}
  CONTEXT: "pr"
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  conditional-skip:
    uses: ./.github/workflows/reusable-conditional-skip.yml

  # Detect PRs whose changes are limited to the .release/ directory (CRT release
  # orchestration). These files don't affect acceptance tests or coverage, so we
  # skip both for them (see the `test` and `coverage` jobs below). This is scoped
  # to this workflow only, so build.yml is unaffected.
  check-release-only:
    runs-on: ubuntu-latest
    name: Check whether only .release files changed
    outputs:
      release-only: ${{ steps.changed-files.outputs.only_changed }}
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          fetch-depth: 0
      - name: Check for changes outside .release
        id: changed-files
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32 # v46.0.1
        with:
          files: |
            .release/**

  get-go-version:
    needs: [conditional-skip]
    if: needs.conditional-skip.outputs.skip-ci != 'true'
    uses: ./.github/workflows/reusable-get-go-version.yml

  coverage:
    needs:
      - conditional-skip
      - check-release-only
      - get-go-version
    if: needs.conditional-skip.outputs.skip-ci != 'true' && needs.check-release-only.outputs.release-only != 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/coverage.yml
    with:
      go-version: ${{ needs.get-go-version.outputs.go-version }}
      pr-number: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.number) || '' }}

  test:
    name: test
    needs: [ conditional-skip, check-release-only ]
    # Skip when only skippable files changed (skip-ci) or when the PR only
    # touches .release/ files (release-only).
    if: needs.conditional-skip.outputs.skip-ci != 'true' && needs.check-release-only.outputs.release-only != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: benc-uk/workflow-dispatch@25b02cc069be46d637e8fe2f1e8484008e9e9609 # v1.2.3
      name: test
      with:
        workflow: test.yml
        repo: hashicorp/consul-k8s-workflows
        ref: main
        token: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
        inputs: '{ "context":"${{ env.CONTEXT }}-${{ github.event.pull_request.number }}", "actor":"${{ github.actor }}", "repository":"${{ github.repository }}", "branch":"${{ env.BRANCH }}", "sha":"${{ env.SHA }}", "json_params":"{\"gotestsum-version\":\"1.12.3\", \"terraform-version\":\"latest\", \"test-ce\":true, \"test-type\":\"short\", \"dual-stack\":true}" }'

  pass-required-checks-on-skip:
    needs: [ conditional-skip, check-release-only ]
    # Fire when CI is skipped (skip-ci) or when the PR only touched .release/
    # files and the test dispatch above was skipped. always() ensures the
    # skip-ci safety net still runs even if check-release-only fails.
    if: >-
      always() &&
      (needs.conditional-skip.outputs.skip-ci == 'true' ||
      needs.check-release-only.outputs.release-only == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The required checks that should be "passed" when the CI is skipped
          - check-name: Unit test helm templates
          - check-name: Unit test helm gen
          - check-name: Unit test enterprise control plane
          - check-name: Unit test control plane
          - check-name: Unit test cli
          - check-name: Unit test acceptance
          - check-name: acceptance
          - check-name: acceptance-cni
          - check-name: acceptance-tproxy
          - check-name: acceptance-ce
          - check-name: acceptance-ce-cni
          - check-name: acceptance-ce-tproxy
          # Required patch-coverage gate. When CI is skipped there is no diff
          # to evaluate, so mark it success to keep skip-CI PRs mergeable.
          - check-name: coverage / coverage-gate
    steps:
    - name: Update final status
      uses: docker://ghcr.io/curtbushko/commit-status-action:e1d661c757934ab35c74210b4b70c44099ec747a
      env:
        INPUT_TOKEN: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
        INPUT_REPOSITORY: ${{ github.repository }}
        INPUT_CONTEXT: ${{ matrix.check-name }}
        INPUT_STATE: success
        INPUT_DESCRIPTION: "Skipped due to conditional-skip check"
        INPUT_SHA: ${{ env.SHA }}
        INPUT_DETAILS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        INPUT_OWNER: "hashicorp"
