# This workflow is responsible for validating backports and commenting on backport PRs tagging PR authors to merge in their backport PRs.
# It is scheduled to run at 9:00 AM every day and will also run when manually triggered.

name: Backport Commenter
run-name: Validate backports and notify PRs owners
on:
  push:
    branches:
      - shashank/add-backport-commenter
  schedule:
   - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      versions:
        description: "A comma seperated string of the x.y versions representing the backport labels to check. Example: 1.13,1.14,1.15. Defaults to active versions if omitted."
        required: false
        type: string
      begin-date:
        description: "Begin Date to check for PRs being merged. In the format of YYYY-MM-DD. Defaults to the configured begin date if omitted."
        required: false
        type: string

env:
  # This needs to be updated to the date of the last release.
  # workflow_dispatch inputs override these values when manually triggered.
  BPA_COMMENTER_BEGIN_DATE: ${{ github.event.inputs['begin-date'] || '2026-08-05' }}
  # This needs to be updated to the versions that are currently being backported.
  # Active releases: 1.8, 1.9, 2.0
  BPA_COMMENTER_VERSIONS: ${{ github.event.inputs.versions || '1.8,1.9,2.0' }}

jobs:

  validate-backports:
    container: hashicorpdev/backport-assistant:v0.6.3
    runs-on: [ self-hosted, linux ]
    permissions:
      id-token: write  # Note: this permission is explicitly required for Vault auth
      contents:
        read
    steps:
      - name: Fetch Secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0

        with:
          url: ${{ vars.CI_VAULT_URL }}
          method: ${{ vars.CI_VAULT_METHOD }}
          path: ${{ vars.CI_VAULT_PATH }}
          jwtGithubAudience: ${{ vars.CI_VAULT_AUD }}
          secrets:
            kv/data/github/${{ github.repository }}/ghactions github_token ;

      - name: backport commenter
        env:
          OWNER: hashicorp
          REPO: consul-k8s
          GITHUB_TOKEN: ${{ steps.secrets.outputs.github_token }}
        run: |
          backport-assistant validate \
            --owner ${OWNER} --repo ${REPO} --versions "${BPA_COMMENTER_VERSIONS}" \
            --begin-date "${BPA_COMMENTER_BEGIN_DATE}" --add-comment