# Reusable workflow that runs unit tests with coverage for the critical Go
# modules (control-plane, cli), merges the profiles, and publishes the results
# via reusable-coverage-report.yml.

name: coverage

on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string
      pr-number:
        required: false
        type: string

jobs:
  conditional-skip:
    uses: ./.github/workflows/reusable-conditional-skip.yml

  get-go-version:
    needs: [conditional-skip]
    if: needs.conditional-skip.outputs.skip-ci != 'true'
    uses: ./.github/workflows/reusable-get-go-version.yml

  unit-tests-control-plane:
    name: unit-tests (control-plane)
    needs: [get-go-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Install consul binary
        # Several control-plane packages use testutil.NewTestServerConfigT which
        # requires the consul binary on PATH to start a real test server.
        run: |
          CONSUL_VERSION="2.0.0"
          curl -sSLO "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_amd64.zip"
          unzip -o "consul_${CONSUL_VERSION}_linux_amd64.zip" consul -d /usr/local/bin
          rm "consul_${CONSUL_VERSION}_linux_amd64.zip"
          consul version

      - name: Run unit tests with coverage
        # -p 1 disables parallelism to avoid port conflicts from shared
        # default metrics / lifecycle server configuration.
        run: cd control-plane && go test ./... -p 1 -coverprofile=coverage.txt -covermode=set

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: control-plane-coverage
          path: control-plane/coverage.txt
          if-no-files-found: ignore

  unit-tests-cli:
    name: unit-tests (cli)
    needs: [get-go-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run unit tests with coverage
        run: cd cli && go test ./... -p 1 -coverprofile=coverage.txt -covermode=set

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: cli-coverage
          path: cli/coverage.txt
          if-no-files-found: ignore

  coverage-report:
    needs:
      - get-go-version
      - unit-tests-control-plane
      - unit-tests-cli
    uses: ./.github/workflows/reusable-coverage-report.yml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      go-version: ${{ inputs.go-version }}
      pr-number: ${{ inputs.pr-number }}

  coverage-gate:
    name: coverage-gate
    needs: [coverage-report]
    # Patch coverage measures the lines a PR adds/modifies, so it only applies
    # to pull requests. Pushes to main call this workflow without a pr-number
    # and have no "patch" to evaluate.
    if: inputs.pr-number != ''
    runs-on: ubuntu-latest
    env:
      # Minimum required coverage of the lines a PR adds/modifies (patch
      # coverage). New/changed code must be at least this well tested.
      PATCH_THRESHOLD: "90"
    steps:
      - name: Enforce patch coverage threshold
        env:
          PATCH: ${{ needs.coverage-report.outputs.patch }}
          COVERED: ${{ needs.coverage-report.outputs.patch_covered }}
          COVERABLE: ${{ needs.coverage-report.outputs.patch_coverable }}
        run: |
          set -euo pipefail

          echo "Patch coverage:     ${PATCH:-<empty>}"
          echo "Required threshold: ${PATCH_THRESHOLD}%"
          echo "Changed lines:      ${COVERED:-0}/${COVERABLE:-0} covered"

          # No coverable Go lines changed (e.g. docs-only or test-only PRs) -> nothing to gate.
          # Fail closed: an empty PATCH means the reusable workflow could not
          # compute patch coverage (no coverage profile produced, so the patch
          # step was skipped). Don't let the gate pass unevaluated.
          if [ -z "${PATCH}" ]; then
            echo "::error::Patch coverage was not computed (no coverage profile produced). Failing closed."
            {
              echo "### ❌ Coverage gate failed"
              echo ""
              echo "Patch coverage could not be computed because no coverage profile was produced (unit tests may not have run or emitted coverage)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${PATCH}" = "N/A" ]; then
            echo "::notice::No coverable Go lines changed in this PR; patch-coverage gate skipped."
            {
              echo "### ✅ Coverage gate passed"
              echo ""
              echo "No coverable Go lines changed in this PR, so there is nothing to gate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PCT="${PATCH%\%}"

          if awk "BEGIN { exit !(${PCT} >= ${PATCH_THRESHOLD}) }"; then
            echo "::notice::Patch coverage ${PATCH} meets the ${PATCH_THRESHOLD}% threshold."
            {
              echo "### ✅ Coverage gate passed"
              echo ""
              echo "Patch coverage **${PATCH}** (${COVERED}/${COVERABLE} changed lines) ≥ required **${PATCH_THRESHOLD}%**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Patch coverage ${PATCH} is below the required ${PATCH_THRESHOLD}% threshold."
            {
              echo "### ❌ Coverage gate failed"
              echo ""
              echo "Patch coverage **${PATCH}** (${COVERED}/${COVERABLE} changed lines) is below the required **${PATCH_THRESHOLD}%** threshold."
              echo ""
              echo "The lines this PR adds or modifies are not sufficiently covered by tests."
              echo "Add tests for the new/changed code, or adjust \`PATCH_THRESHOLD\` in \`.github/workflows/coverage.yml\` (with reviewer sign-off)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  coverage-regression-gate:
    name: coverage-regression-gate
    needs: [coverage-report]
    # Only runs on PRs — a push to main has no baseline to regress against
    # (it IS the new baseline), and the regression gate compares PR coverage
    # against the committed .github/coverage-baseline.txt file.
    if: inputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Download pkg-summary artifact
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: pkg-summary
          path: .

      - name: Enforce per-package coverage regression gate
        env:
          TOTAL: ${{ needs.coverage-report.outputs.total }}
        run: |
          set -euo pipefail

          # If no coverage profiles were produced (e.g. only non-Go files
          # changed), there is nothing to compare — pass.
          if [ "${TOTAL:-N/A}" = "N/A" ]; then
            echo "::notice::No coverage data produced; regression gate skipped."
            {
              echo "### ✅ Coverage regression gate passed"
              echo ""
              echo "No coverage data was produced (no coverable Go files), so there is nothing to compare."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # If no baseline file exists yet (first run after feature merge),
          # skip gracefully — the next push to main will create it.
          if [ ! -f ".github/coverage-baseline.txt" ]; then
            echo "::notice::No coverage baseline found (.github/coverage-baseline.txt). Skipping regression check."
            {
              echo "### ✅ Coverage regression gate passed"
              echo ""
              echo "No coverage baseline file found. The baseline will be created on the next merge to \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASELINE=".github/coverage-baseline.txt"
          PR_SUMMARY="pkg-summary.txt"

          FAILED=0
          TABLE_ROWS=""

          # For every package in the PR summary, check if its average dropped
          # below the stored baseline value. Packages not in the baseline (new
          # packages) are skipped — they have no prior coverage to regress from.
          while IFS= read -r line; do
            pkg=$(echo "$line" | awk '{print $1}')
            pr_pct=$(echo "$line" | awk '{print $2}' | tr -d '%')

            # Look up this package in the baseline.
            base_line=$(grep "^${pkg} " "$BASELINE" || true)
            if [ -z "$base_line" ]; then
              # New package — no baseline to compare against, pass.
              TABLE_ROWS="${TABLE_ROWS}| \`${pkg}\` | N/A (new) | ${pr_pct}% | — | ✅ new package |\n"
              continue
            fi

            base_pct=$(echo "$base_line" | awk '{print $2}' | tr -d '%')

            # Compare: fail if PR average is strictly less than baseline.
            if awk "BEGIN { exit !(${pr_pct} < ${base_pct}) }"; then
              delta=$(awk "BEGIN { printf \"%.1f\", ${pr_pct} - ${base_pct} }")
              TABLE_ROWS="${TABLE_ROWS}| \`${pkg}\` | ${base_pct}% | ${pr_pct}% | ${delta}% | ❌ REGRESSED |\n"
              echo "::error::Package '${pkg}' coverage dropped from ${base_pct}% to ${pr_pct}% (${delta}%)"
              FAILED=1
            else
              delta=$(awk "BEGIN { printf \"%.1f\", ${pr_pct} - ${base_pct} }")
              prefix=""
              [ "$(awk "BEGIN{print (${delta}>0)}")" = "1" ] && prefix="+"
              TABLE_ROWS="${TABLE_ROWS}| \`${pkg}\` | ${base_pct}% | ${pr_pct}% | ${prefix}${delta}% | ✅ OK |\n"
            fi
          done < "$PR_SUMMARY"

          # Write the full table to the step summary regardless of pass/fail.
          {
            if [ "$FAILED" -eq 1 ]; then
              echo "### ❌ Coverage regression gate failed"
              echo ""
              echo "One or more packages touched by this PR have lower average coverage than the \`main\` baseline."
              echo "Add or improve tests so that per-package coverage does not drop."
            else
              echo "### ✅ Coverage regression gate passed"
              echo ""
              echo "All packages maintain or improve their coverage compared to the \`main\` baseline."
            fi
            echo ""
            echo "| Package | Baseline | PR | Delta | Status |"
            echo "|---------|----------|----|-------|--------|"
            printf "%b" "$TABLE_ROWS"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
